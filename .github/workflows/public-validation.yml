name: Public validation

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate public contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Run deterministic checks
        shell: bash
        run: |
          set -euo pipefail
          python3 --version
          python3 -B eval/check.py --self-test
          python3 -B eval/check.py eval/fixtures/pass.json
          python3 -B eval/check.py --public-tree
          python3 -B tests/install_test.py
          bash -n install.sh
          for path in PUBLIC_FILES.json eval/*.json eval/results/*.json; do
            python3 -m json.tool "$path" >/dev/null
          done

      - name: Check committed whitespace
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            git diff --check "$BASE_SHA...$HEAD_SHA"
          else
            git diff-tree --check --no-commit-id --root -r "$GITHUB_SHA"
          fi
